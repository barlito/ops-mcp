name: Deploy

on:
  workflow_dispatch:
    inputs:
      re-deploy:
        description: "Full stack deploy (applies the whole docker-compose-prod.yml) instead of the image-only update. Required for the first deploy."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: barlito/ci/.github/workflows/swarm-deploy.yaml@v1
    with:
      full: ${{ inputs.re-deploy }}
      images: barlito/ops-mcp
      env-secrets: ADMIN_PROXY_SECRET ADMIN_WEB_SECRET
      optional-env-secrets: GRAFANA_URL GRAFANA_TOKEN GH_DEPLOYMENTS_TOKEN AUTHELIA_SESSION_COOKIE
      timeout-minutes: 15
    secrets: inherit
