name: Docker check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: barlito/ci/.github/workflows/docker-check.yaml@v1
    with:
      targets: runtime
      compose-files: docker-compose.yaml docker-compose-prod.yml
      compose-env: |
        HOST_UID=1000
        HOST_GID=1000
        IMAGE_TAG=ci
        TAG=ci
        CONFIG_VERSION=ci
        ADMIN_PROXY_SECRET_NAME=ci
        ADMIN_WEB_SECRET_NAME=ci
        GRAFANA_TOKEN_SECRET_NAME=ci
        GH_DEPLOYMENTS_TOKEN_SECRET_NAME=ci
        ADMIN_PROXY_SECRET=ci-dummy-admin-proxy-secret-0123456789abcdef
        ADMIN_WEB_SECRET=ci-dummy-admin-web-secret-0123456789abcdef
