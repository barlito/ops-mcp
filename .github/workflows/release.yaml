name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: barlito/ci/.github/workflows/docker-release.yaml@v1
    with:
      images: '[{"name":"ops-mcp","target":"runtime"}]'
    secrets: inherit
