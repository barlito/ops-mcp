# ────────────────────────────────────────────────────────────────
# Read-only MCP server to diagnose production without SSH.
# ────────────────────────────────────────────────────────────────
#
# LOCAL dev file, deployed via Docker Swarm like prod. Swarm ignores `build:` at deploy time, so
# `make deploy` runs `docker compose build` first to produce the `ops-mcp:${IMAGE_TAG}` tag
# referenced below (unique per build, so the stack rolls). See docker-compose-prod.yml for prod.
# Fixed project name: compose prefixes network names with it, and it would otherwise be the directory name.
name: ops-mcp

services:
  ops-mcp:
    build: .
    image: ops-mcp:${IMAGE_TAG:-local}
    # ./data is a bind mount owned by the host user, not the image's appuser: run as the host
    # uid/gid (set by `make deploy`). Prod uses a named volume owned by appuser.
    user: "${HOST_UID}:${HOST_GID}"
    read_only: true
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_PATH=/data/ops.db
      - REGISTRY_PATH=/etc/ops-mcp/registry.yaml
      # Shown in the ready-to-paste `claude mcp add` command after credential creation
      - PUBLIC_MCP_URL=https://ops.local.barlito.fr/mcp
      # Swarm DNS for the Traefik tasks: only they may set X-Forwarded-For.
      - TRUSTED_PROXY=tasks.traefik_traefik
      # Web admin UI (behind Authelia): own port, only users in this group
      - ADMIN_WEB_PORT=3002
      - ADMIN_GROUP=admins
      # traefik-base names the local Authelia cookie differently (prod uses the default)
      - AUTHELIA_SESSION_COOKIE=authelia_session_local
      # Shared secret Traefik injects (X-Ops-Admin-Proxy) after Authelia, and the CSRF/sealing key
      - ADMIN_PROXY_SECRET=${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required (make deploy generates it)}
      - ADMIN_WEB_SECRET=${ADMIN_WEB_SECRET:?ADMIN_WEB_SECRET is required (make deploy generates it)}
    # One SQLite file: two tasks must never overlap.
    stop_grace_period: 30s
    configs:
      - source: ops_registry
        target: /etc/ops-mcp/registry.yaml
        mode: 0444
    volumes:
      - ./data:/data
      - type: tmpfs
        target: /tmp
    networks:
      - traefik_traefik_proxy
      - ops_docker
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - traefik.enable=true

        - traefik.http.services.ops-mcp.loadbalancer.server.port=3000
        - traefik.http.services.ops-admin.loadbalancer.server.port=3002

        - traefik.http.routers.ops-mcp.rule=Host(`ops.local.barlito.fr`)
        - traefik.http.routers.ops-mcp.service=ops-mcp
        - traefik.http.routers.ops-mcp.entrypoints=http
        # Never serve /mcp (credentials) over plain HTTP
        - traefik.http.routers.ops-mcp.middlewares=redirect-to-https@file

        - traefik.http.routers.ops-mcp-secure.rule=Host(`ops.local.barlito.fr`)
        - traefik.http.routers.ops-mcp-secure.service=ops-mcp
        - traefik.http.routers.ops-mcp-secure.entrypoints=https
        - traefik.http.routers.ops-mcp-secure.tls=true
        # Own Bearer-token / connector-key login -> no Authelia (claude.ai cannot pass it), just security headers
        - traefik.http.routers.ops-mcp-secure.middlewares=security-headers@file

        # Web admin UI: Authelia SSO (Remote-User/Remote-Groups), never exposed without it
        - traefik.http.routers.ops-admin.rule=Host(`ops-admin.local.barlito.fr`)
        - traefik.http.routers.ops-admin.service=ops-admin
        - traefik.http.routers.ops-admin.entrypoints=http
        - traefik.http.routers.ops-admin.middlewares=redirect-to-https@file

        - traefik.http.routers.ops-admin-secure.rule=Host(`ops-admin.local.barlito.fr`)
        - traefik.http.routers.ops-admin-secure.service=ops-admin
        - traefik.http.routers.ops-admin-secure.entrypoints=https
        - traefik.http.routers.ops-admin-secure.tls=true
        # Injected after Authelia (overwrites any client value): proves the request went through Traefik
        - traefik.http.middlewares.ops-admin-proxy.headers.customrequestheaders.X-Ops-Admin-Proxy=${ADMIN_PROXY_SECRET:?ADMIN_PROXY_SECRET is required (make deploy generates it)}
        - traefik.http.routers.ops-admin-secure.middlewares=authelia-auth@file,ops-admin-proxy,security-headers@file

  # Read-only Docker API proxy in front of the raw socket: the only service that touches it.
  # Only the endpoints ops-mcp needs are whitelisted (no CONTAINERS) and every write is refused.
  dockerproxy-ops:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    environment:
      SERVICES: 1
      TASKS: 1
      NODES: 1
      INFO: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ops_docker
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

networks:
  traefik_traefik_proxy:
    external: true
  # Nothing but ops-mcp and its proxy: no route out, no route in.
  ops_docker:
    driver: overlay
    internal: true

configs:
  # Swarm configs are immutable: the name carries a hash of the content (CONFIG_VERSION, set by the
  # Makefile), so a changed registry creates a new config and rolls the service.
  ops_registry:
    name: ops_registry_${CONFIG_VERSION:?CONFIG_VERSION is required (make deploy computes it)}
    file: ./config/registry.local.yaml
