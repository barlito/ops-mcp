# Throwaway Prometheus for `make test.integration-metrics`. Project name: ops-mcp-it-metrics.
name: ops-mcp-it-metrics

services:
  # Same minor as observability-stack. Backfills the generated OpenMetrics file into the TSDB volume.
  backfill:
    image: prom/prometheus:v3.16.0
    profiles: [backfill]
    entrypoint: [promtool, tsdb, create-blocks-from, openmetrics, /work/data.om, /prometheus]
    volumes:
      - ./work:/work:ro
      - tsdb:/prometheus

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - tsdb:/prometheus
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://localhost:9090/-/ready"]
      interval: 2s
      retries: 30

volumes:
  tsdb:
